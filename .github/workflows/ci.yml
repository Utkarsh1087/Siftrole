name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Validate All Apps
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummydb?sslmode=require"
      GROQ_API_KEY_1: "dummy_groq_key"
      NEXT_PUBLIC_APP_URL: "https://siftrole.com"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            admin/package-lock.json
            server/package-lock.json

      # 1. Server Syntax & Health Check
      - name: Install & Validate Server
        run: |
          cd server
          npm ci --ignore-scripts || npm install
          node --check src/index.js
          echo "Server syntax check passed."

      # 2. Client Build & TypeScript Validation
      - name: Install & Build Client
        run: |
          cd client
          npm ci || npm install
          npx tsc --noEmit
          npm run build
          echo "Client build passed."

      # 3. Admin Build & TypeScript Validation
      - name: Install & Build Admin
        run: |
          cd admin
          npm ci || npm install
          npx tsc --noEmit
          npm run build
          echo "Admin build passed."
